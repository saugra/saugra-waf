[package]
name = "saugra-waf"
version = "1.0.7"
edition = "2021"
description = "A lightweight rule-based + AI-assisted Web Application Firewall."
license = "AGPL-3.0-only"

[lib]
name = "saugra_waf"
path = "src/lib.rs"

[[bin]]
name = "saugra-waf"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Emanuel Wanyonyi <wanyonyi.d.emanuel@gmail.com>"
license-file = ["LICENSE", "0"]
extended-description = """
Saugra is a rule-based and AI-assisted Web Application Firewall that runs as a
reverse proxy, inspects HTTP traffic, writes structured security events, and
supports monitor-first rollout.
"""
depends = "$auto, adduser, systemd"
section = "net"
priority = "optional"
assets = [
  ["target/release/saugra-waf", "usr/bin/saugra-waf", "755"],
  ["configs/saugra-waf.production.example.yml", "usr/share/saugra-waf/saugra-waf.production.example.yml", "644"],
  ["configs/rules/*.yml", "usr/share/saugra-waf/rules/", "644"],
  ["configs/standards/*.yml", "usr/share/saugra-waf/standards/", "644"],
  ["configs/intelligence/*.yml", "usr/share/saugra-waf/intelligence/", "644"],
  ["configs/ollama/Modelfile", "usr/share/saugra-waf/ollama/Modelfile", "644"],
  ["configs/ollama/evaluation-cases.jsonl", "usr/share/saugra-waf/ollama/evaluation-cases.jsonl", "644"],
  ["configs/saugra-waf.production.example.yml", "usr/share/doc/saugra-waf/saugra-waf.production.example.yml", "644"],
  ["configs/nginx.production.example.conf", "usr/share/doc/saugra-waf/nginx.production.example.conf", "644"],
  ["configs/apache.production.example.conf", "usr/share/doc/saugra-waf/apache.production.example.conf", "644"],
  ["packaging/systemd/saugra-waf.service", "lib/systemd/system/saugra-waf.service", "644"],
  ["README.md", "usr/share/doc/saugra-waf/README.md", "644"],
  ["NOTICE", "usr/share/doc/saugra-waf/NOTICE", "644"],
  ["TRADEMARKS.md", "usr/share/doc/saugra-waf/TRADEMARKS.md", "644"],
  ["docs/LICENSING.md", "usr/share/doc/saugra-waf/LICENSING.md", "644"],
  ["docs/PRODUCTION_DEPLOYMENT.md", "usr/share/doc/saugra-waf/PRODUCTION_DEPLOYMENT.md", "644"],
  ["docs/AI_PROVIDERS.md", "usr/share/doc/saugra-waf/AI_PROVIDERS.md", "644"],
  ["docs/OLLAMA.md", "usr/share/doc/saugra-waf/OLLAMA.md", "644"],
  ["docs/DEBIAN_PACKAGING.md", "usr/share/doc/saugra-waf/DEBIAN_PACKAGING.md", "644"],
]
maintainer-scripts = "packaging/debian"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
hyper = "1.4"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
percent-encoding = "2.3"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.39", features = ["io-util", "macros", "process", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
