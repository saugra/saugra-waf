server:
  listen: 127.0.0.1:8787
  mode: monitor

upstreams:
  - name: app
    host: example.com
    target: http://127.0.0.1:8000
  # - name: api
  #   host: api.example.com
  #   target: http://127.0.0.1:8001
  # - name: ws
  #   host: example.com
  #   target: http://127.0.0.1:8002

routes:
  - path_prefix: /
    upstream: app
  # - path_prefix: /api/
  #   upstream: api
  # - path_prefix: /ws/
  #   upstream: ws

security:
  max_body_size: 2mb
  enable_rate_limiting: true
  block_suspicious_user_agents: true
  inspect_json_body: true

rate_limit:
  backend: redis
  redis_url: redis://127.0.0.1:6379
  redis_password: null
  requests_per_minute: 120
  burst: 30
  routes:
    - path: /sensitive-action
      requests_per_minute: 10
      burst: 5

behavior:
  enabled: false
  mode: monitor
  backend: local
  state_path: /var/lib/saugra/saugra-behavior-state.json
  score_window: 10m
  decay_window: 30m
  monitor_threshold: 40
  block_threshold: 80
  route_overrides:
    - path: /login
      monitor_threshold: 30
      block_threshold: 60
      score_window: 5m
  category_overrides:
    - category: scanner_behavior
      score_delta: 15
      monitor_threshold: 30
      block_threshold: 70
  probe_paths:
    - /.env
    - /wp-admin
    - /wp-login.php
    - /phpmyadmin
    - /admin
    - /.git
    - /server-status

bot_protection:
  enabled: false
  mode: monitor
  backend: local
  state_path: /var/lib/saugra/saugra-bot-state.json
  score_window: 10m
  monitor_threshold: 40
  block_threshold: 80
  temporary_block_duration: 15m
  allowlists:
    user_agents:
      - Googlebot
    ip_ranges: []
  blocklists:
    user_agents: []
    ip_ranges: []
  routes:
    - path: /login
      monitor_threshold: 30
      block_threshold: 60
  scanner_paths:
    - /.env
    - /wp-admin
    - /wp-login.php
    - /phpmyadmin
    - /admin
    - /.git
    - /server-status
    - /vendor/phpunit
  rule:
    id: SAUGRA-BOT-PROTECTION-001
    name: Bot Protection Threshold
    category: bot_protection
    monitor_severity: medium
    block_severity: high
    paranoia_level: 1
    explanation: Bot protection score reached the configured threshold.
    owasp_category: A06:2025-Insecure Design

rules:
  owasp_crs: true
  paranoia_level: 1
  detection_paranoia_level: 1
  blocking_paranoia_level: 1
  inbound_anomaly_threshold: 5
  files:
    - /etc/saugra/rules/REQUEST-913-SCANNER-DETECTION.yml
    - /etc/saugra/rules/REQUEST-914-AUTHENTICATION-ABUSE.yml
    - /etc/saugra/rules/REQUEST-916-INSECURE-DESIGN.yml
    - /etc/saugra/rules/REQUEST-920-PROTOCOL-ENFORCEMENT.yml
    - /etc/saugra/rules/REQUEST-921-CRYPTO-TRANSPORT.yml
    - /etc/saugra/rules/REQUEST-932-APPLICATION-ATTACK-RCE.yml
    - /etc/saugra/rules/REQUEST-930-APPLICATION-ATTACK-LFI.yml
    - /etc/saugra/rules/REQUEST-941-APPLICATION-ATTACK-XSS.yml
    - /etc/saugra/rules/REQUEST-942-APPLICATION-ATTACK-SQLI.yml
    - /etc/saugra/rules/REQUEST-944-SUPPLY-CHAIN.yml
    - /etc/saugra/rules/REQUEST-945-INTEGRITY.yml
    - /etc/saugra/rules/REQUEST-949-LOGGING-ALERTING.yml
    - /etc/saugra/rules/REQUEST-950-EXCEPTIONAL-CONDITIONS.yml
  # Example false-positive tuning:
  # exclusions:
  #   - name: Allow article HTML previews
  #     rule_ids:
  #       - SAUGRA-XSS-001
  #     path_prefixes:
  #       - /api/articles
  #     query_params:
  #       - content
  exclusions: []

ai:
  enabled: true
  mode: explain_only

logging:
  format: json
  level: info
  event_log_path: /var/log/saugra/saugra-events.jsonl
  event_log_max_size: 100mb
  event_log_max_files: 30
  timezone: Africa/Nairobi

websocket:
  enabled: true
  # Configure exact public browser origins before routing /ws/ through Saugra.
  allowed_origins:
    - https://example.com
  allowed_hosts:
    - example.com

posture:
  enabled: true
  expected_external_scheme: https
  require_secure_cookies: true
  require_security_headers: true
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
  dependency_report_path: null

reports:
  dependency_report_paths: []

standards:
  owasp_catalog: /etc/saugra/standards/owasp-top-10-2025.yml
