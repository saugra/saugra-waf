<VirtualHost *:80>
    ServerName example.com

    # Terminate TLS in a separate *:443 virtual host or at your load balancer.
    # Keep Saugra private; do not expose 127.0.0.1:8787 directly to the internet.

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass /_saugra/health http://127.0.0.1:8787/_saugra/health
    ProxyPassReverse /_saugra/health http://127.0.0.1:8787/_saugra/health

    ProxyPass /ws/ ws://127.0.0.1:8787/ws/ connectiontimeout=5 timeout=86400
    ProxyPassReverse /ws/ ws://127.0.0.1:8787/ws/

    ProxyPass / http://127.0.0.1:8787/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8787/

    <Location "/_saugra/health">
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/saugra-example-error.log
    CustomLog ${APACHE_LOG_DIR}/saugra-example-access.log combined
</VirtualHost>
