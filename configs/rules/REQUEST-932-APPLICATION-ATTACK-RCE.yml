metadata:
  name: saugra-application-attack-rce
  version: 0.1.0

rules:
  - id: SAUGRA-CMD-001
    name: Command Injection Pattern
    category: command_injection
    severity: critical
    paranoia_level: 1
    targets:
      - query
    transforms:
      - url_decode
      - plus_to_space
    pattern: "(?i)(;\\s*(cat|bash|sh|curl|wget)\\b|`[^`]+`|\\|\\s*(cat|bash|sh)\\b)"
    explanation: Request data matched a command injection pattern.
    owasp_category: A03:2021-Injection
