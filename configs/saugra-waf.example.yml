server:
  listen: 127.0.0.1:8787
  mode: monitor

upstreams:
  - name: app
    host: example.com
    target: http://127.0.0.1:8000
  # Additional upstreams can split APIs or WebSockets across backend processes.
  # - name: api
  #   host: api.example.com
  #   target: http://127.0.0.1:8001
  # - name: ws
  #   host: example.com
  #   target: http://127.0.0.1:8002

routes:
  - path_prefix: /
    upstream: app
  # Longest path-prefix match wins.
  # - path_prefix: /api/
  #   upstream: api
  # - path_prefix: /ws/
  #   upstream: ws

security:
  max_body_size: 2mb
  enable_rate_limiting: true
  block_suspicious_user_agents: true
  inspect_json_body: true

forwarded_headers:
  enabled: true
  trusted_proxies:
    - 127.0.0.1/32
    - ::1
  real_ip_header: X-Forwarded-For
  proto_header: X-Forwarded-Proto
  expected_proto: https
  insecure_proto_score: 10

rate_limit:
  backend: memory
  requests_per_minute: 120
  burst: 30
  routes:
    - path: /sensitive-action
      requests_per_minute: 10
      burst: 5

behavior:
  enabled: true
  mode: monitor
  backend: local
  state_path: logs/saugra-waf-behavior-state.json
  score_window: 10m
  decay_window: 30m
  monitor_threshold: 40
  block_threshold: 80
  route_overrides:
    - path: /login
      monitor_threshold: 30
      block_threshold: 60
      score_window: 5m
  category_overrides:
    - category: scanner_behavior
      score_delta: 15
      monitor_threshold: 30
      block_threshold: 70
  # "builtin" is embedded in compiled binaries. Use probe_paths_extra for local
  # additions, or point probe_path_catalog to an external YAML catalog.
  probe_path_catalog: builtin
  probe_paths_extra: []
  probe_path_exclusions: []

# Route-aware request-shape learning for unknown-threat monitoring. It learns
# only from requests with no deterministic rule matches and never stores bodies.
unknown_threats:
  enabled: false
  mode: monitor
  shadow_review_completed: false
  backend: local
  state_path: logs/saugra-waf-unknown-threat-state.json
  minimum_observations: 100
  monitor_threshold: 20
  block_threshold: 40
  minimum_independent_signals: 2
  minimum_baseline_age: 7d
  minimum_block_observations: 1000
  # "builtin" embeds configs/intelligence/unknown-threat-signals.yml.
  signal_catalog: builtin
  body_size_multiplier: 4
  promotion_observations: 3
  trusted_learning_only: false
  trusted_learning_clients: []
  max_methods_per_route: 16
  max_content_types_per_route: 32
  max_query_parameters_per_route: 256
  retention: 30d
  max_routes: 10000
  excluded_paths:
    - /_saugra-waf/health
  routes:
    - path: /uploads
      learning_enabled: false
    - path: /admin
      high_risk: true
      minimum_observations: 200
      monitor_threshold: 15
      block_threshold: 40

# Correlates privacy-minimized security observations into monitor-only attack
# campaigns. Use Redis for multi-instance production deployments.
campaign_correlation:
  enabled: false
  mode: monitor
  backend: local
  state_path: logs/saugra-waf-campaign-state.json
  # For production:
  # backend: redis
  # redis_url: redis://127.0.0.1:6379
  # redis_password: ${SAUGRA_REDIS_PASSWORD}
  redis_key_prefix: saugra-waf:campaign-correlation
  window: 15m
  retention: 24h
  max_events: 50000
  # "builtin" embeds configs/intelligence/campaign-policies.yml.
  policy_catalog: builtin

bot_protection:
  enabled: true
  mode: monitor
  backend: local
  state_path: logs/saugra-waf-bot-state.json
  score_window: 10m
  monitor_threshold: 40
  block_threshold: 80
  temporary_block_duration: 15m
  allowlists:
    user_agents:
      - Googlebot
    ip_ranges: []
  blocklists:
    user_agents: []
    ip_ranges: []
  routes:
    - path: /login
      monitor_threshold: 30
      block_threshold: 60
  # "builtin" is embedded in compiled binaries. Use scanner_paths_extra for
  # local additions, or point scanner_path_catalog to an external YAML catalog.
  scanner_path_catalog: builtin
  scanner_paths_extra: []
  scanner_path_exclusions: []
  rule:
    id: SAUGRA-BOT-PROTECTION-001
    name: Bot Protection Threshold
    category: bot_protection
    monitor_severity: medium
    block_severity: high
    paranoia_level: 1
    explanation: Bot protection score reached the configured threshold.
    owasp_category: A06:2025-Insecure Design

runtime_policy:
  enabled: true
  path: logs/runtime-policy.json
  reload_interval: 5s
  default_duration: 2h
  allowlist_effect: skip_bot_and_behavior_block

rules:
  owasp_crs: true
  paranoia_level: 1
  detection_paranoia_level: 1
  blocking_paranoia_level: 1
  inbound_anomaly_threshold: 5
  files:
    - configs/rules/REQUEST-913-SCANNER-DETECTION.yml
    - configs/rules/REQUEST-914-AUTHENTICATION-ABUSE.yml
    - configs/rules/REQUEST-916-INSECURE-DESIGN.yml
    - configs/rules/REQUEST-920-PROTOCOL-ENFORCEMENT.yml
    - configs/rules/REQUEST-921-CRYPTO-TRANSPORT.yml
    - configs/rules/REQUEST-932-APPLICATION-ATTACK-RCE.yml
    - configs/rules/REQUEST-930-APPLICATION-ATTACK-LFI.yml
    - configs/rules/REQUEST-941-APPLICATION-ATTACK-XSS.yml
    - configs/rules/REQUEST-942-APPLICATION-ATTACK-SQLI.yml
    - configs/rules/REQUEST-944-SUPPLY-CHAIN.yml
    - configs/rules/REQUEST-945-INTEGRITY.yml
    - configs/rules/REQUEST-949-LOGGING-ALERTING.yml
    - configs/rules/REQUEST-950-EXCEPTIONAL-CONDITIONS.yml
  exclusions: []

ai:
  enabled: true
  mode: explain_only
  provider: llama_cpp
  llama_cpp_url: http://127.0.0.1:8080
  model: saugra-qwen3-0.6b
  prompt_version: saugra-explain-v1
  timeout: 60s
  audit_log_path: logs/saugra-waf-ai-audit.jsonl
  audit_log_max_size: 100mb
  audit_log_max_files: 10
  max_tuning_suggestions: 3
  # llama.cpp should run with Qwen3 0.6B Q8, a 2048-token context, and one
  # inference thread on constrained shared hosts. Below 2 GB RAM, use
  # enabled: false or provider: local.
  # Deterministic fallback is automatic when llama.cpp is unavailable.
  # Ollama remains available as an alternative:
  # provider: ollama
  # ollama_url: http://127.0.0.1:11434
  # model: qwen3:4b
  # OpenAI, Gemini, and other remote APIs use an operator-managed adapter:
  # provider: command
  # command: /usr/local/bin/saugra-ai-adapter
  # command_args: ["--provider", "example"]

logging:
  format: json
  level: info
  event_log_path: logs/saugra-waf-events.jsonl
  # Request IDs remain explainable while their events are in the active log or
  # these retained rotated files. Retention is volume-based, not day-based.
  event_log_max_size: 100mb
  event_log_max_files: 10
  timezone: UTC

security_summary:
  enabled: true
  schedule: daily
  send_time: "08:00"
  timezone: UTC
  lookback: 24h
  output_path: logs/saugra-waf-security-summary-YYYY-MM-DD.json
  channels:
    - type: file
    # Optional local email delivery after sendmail/postfix is configured:
    # - type: email
    #   from: saugra-waf@example.com
    #   to:
    #     - security@example.com
    #   sendmail_path: /usr/sbin/sendmail

storage_cleanup:
  enabled: true
  schedule: daily
  run_time: "02:30"
  # This command also prunes the local unknown-threat state using
  # unknown_threats.retention.
  # Start new deployments with dry_run true. Switch to false after reviewing
  # `saugra-waf cleanup run --dry-run --config configs/saugra-waf.example.yml`.
  dry_run: true
  targets:
    - name: local security summaries
      directory: logs
      filename_prefix: saugra-waf-security-summary-
      filename_suffix: .json
      older_than: 30d
    - name: local summary admin events
      directory: logs
      filename_prefix: saugra-waf-security-summary-admin-events
      filename_suffix: .jsonl
      older_than: 90d

websocket:
  # Set to false if your application does not use WebSockets.
  enabled: true
  # allowed_origins checks the browser Origin header during the WebSocket
  # handshake. Use exact public site origins, for example:
  # - https://test.example.com
  allowed_origins:
    - https://example.com
  # allowed_hosts checks the public Host header used for WebSocket requests.
  # This should normally match the domain users connect to.
  allowed_hosts:
    - example.com

posture:
  enabled: true
  expected_external_scheme: https
  require_secure_cookies: true
  require_security_headers: true
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
  dependency_report_path: null

reports:
  dependency_report_paths: []

standards:
  owasp_catalog: configs/standards/owasp-top-10-2025.yml
