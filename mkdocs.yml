site_name: Saugra WAF
site_description: Production-focused documentation for the Saugra Web Application Firewall
site_url: https://saugra-waf.readthedocs.io/
repo_url: https://github.com/saugra/saugra-waf
repo_name: saugra/saugra-waf
edit_uri: edit/main/docs/
copyright: Copyright &copy; Saugra contributors

docs_dir: docs

theme:
  name: material
  logo: img/saugra-waf-logo.jpeg
  favicon: img/saugra-waf-logo.jpeg
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Administration: ADMIN_GUIDE.md
  - Architecture: ARCHITECTURE.md
  - Maintainers: RELEASE_PROCESS.md
  - About:
      - Licensing: LICENSING.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
  nav:
    omitted_files: info
    not_found: warn
