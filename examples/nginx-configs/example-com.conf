server {
	server_name example.com;


	location /favicon.ico { access_log off; log_not_found off; }
	 access_log /var/log/nginx/example.com-prod-access.log;
	 error_log  /var/log/nginx/example.com-prod-error.log;

        location /static/ {
            alias /opt/static-files/example.com/;
        }

        location /media/ {
            alias /media/;
        }


        location / {
                include proxy_params;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
                client_max_body_size 40M;
				proxy_pass http://127.0.1:8000;
        }
        # WebSocket requests to Daphne (ASGI)
        location /ws/ {
		proxy_pass http://127.0.0.1:8002;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400; # Long timeout for WebSocket persistence	
	}


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name example.com;
	listen 80 default_server;
	listen [::]:80 default_server;
    return 404; # managed by Certbot


}
