<VirtualHost *:80>
    ServerName laravel.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass /_saugra-waf/health http://127.0.0.1:8787/_saugra-waf/health
    ProxyPassReverse /_saugra-waf/health http://127.0.0.1:8787/_saugra-waf/health

    ProxyPass / http://127.0.0.1:8787/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8787/

    <Location "/_saugra-waf/health">
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/laravel-saugra-error.log
    CustomLog ${APACHE_LOG_DIR}/laravel-saugra-access.log combined
</VirtualHost>
