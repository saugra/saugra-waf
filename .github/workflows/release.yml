name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  deb:
    name: Debian package
    # Build on the oldest supported glibc baseline so the package remains
    # installable on Debian 12 and newer Ubuntu releases.
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.6.0 --locked

      - name: Build Debian package
        run: cargo deb --locked

      - name: Inspect Debian package
        run: |
          dpkg-deb -I target/debian/*.deb
          dpkg-deb -c target/debian/*.deb

      - name: Install-test package on Ubuntu
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:24.04 \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y ./target/debian/*.deb
              saugra-waf test-config --config /etc/saugra-waf/saugra-waf.yml
              systemctl list-unit-files saugra-waf.service
            '

      - name: Install-test package on Ubuntu 22.04
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:22.04 \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y ./target/debian/*.deb
              saugra-waf test-config
              systemctl list-unit-files saugra-waf.service
            '

      - name: Install-test package on Debian
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:12 \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y ./target/debian/*.deb
              saugra-waf test-config --config /etc/saugra-waf/saugra-waf.yml
              systemctl list-unit-files saugra-waf.service
            '

      - name: Build unsigned APT repository artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev
          scripts/build-apt-repository.sh --output apt-repo target/debian/*.deb
          test -s apt-repo/dists/stable/Release
          test -s apt-repo/dists/stable/main/binary-amd64/Packages.gz

      - name: Install-test unsigned APT repository on Ubuntu
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:24.04 \
            bash -euxo pipefail -c '
              printf "%s\n" "deb [trusted=yes] file:/workspace/apt-repo stable main" > /etc/apt/sources.list.d/saugra-waf.list
              apt-get update
              apt-get install -y saugra-waf
              saugra-waf test-config --config /etc/saugra-waf/saugra-waf.yml
            '

      - name: Upload unsigned APT repository dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: saugra-waf-apt-repository-dry-run
          path: apt-repo

      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: target/debian/*.deb

      - name: Build signed GitHub Pages APT repository
        env:
          SAUGRA_APT_GPG_KEY_ID: ${{ secrets.SAUGRA_APT_GPG_KEY_ID }}
          SAUGRA_APT_GPG_PASSPHRASE: ${{ secrets.SAUGRA_APT_GPG_PASSPHRASE }}
          SAUGRA_APT_GPG_PRIVATE_KEY: ${{ secrets.SAUGRA_APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$SAUGRA_APT_GPG_KEY_ID" ] ||
             [ -z "$SAUGRA_APT_GPG_PRIVATE_KEY" ] ||
             [ -z "$SAUGRA_APT_GPG_PASSPHRASE" ]; then
            echo "APT signing key ID, private key, and passphrase secrets are required for publishing" >&2
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/saugra-waf-apt-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$SAUGRA_APT_GPG_PRIVATE_KEY" | gpg --batch --import

          install -d site
          gpg --batch --yes --armor --export "$SAUGRA_APT_GPG_KEY_ID" > site/saugra-waf.gpg
          scripts/build-apt-repository.sh \
            --output site/apt \
            --signing-key "$SAUGRA_APT_GPG_KEY_ID" \
            target/debian/*.deb
          test -s site/saugra-waf.gpg
          test -s site/apt/dists/stable/InRelease
          test -s site/apt/dists/stable/Release.gpg
          gpg --batch --verify site/apt/dists/stable/Release.gpg site/apt/dists/stable/Release
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages APT repository
        id: deployment
        uses: actions/deploy-pages@v5
