name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.lock

      - name: Install documentation dependencies (locked)
        run: pip install --requirement docs/requirements.lock

      - name: Audit documentation dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement docs/requirements.lock

      - name: Build documentation
        run: mkdocs build --strict

  test:
    name: Rust
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      REDIS_URL: redis://127.0.0.1:6379

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify package lockfiles present
        run: |
          test -f Cargo.lock || (echo "Missing Cargo.lock" && exit 1)
          test -f package-lock.json || (echo "Missing package-lock.json" && exit 1)
          test -f docs/requirements.lock || (echo "Missing docs/requirements.lock" && exit 1)

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

      - name: Offline build verification (zero network access drift check)
        run: cargo build --locked --offline

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (via script)
        run: ./scripts/test.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 70

      - name: Fail if overall region coverage drops below 70%
        run: cargo llvm-cov --locked --all-features --workspace --fail-under-regions 70

      - name: Verify coverage file
        run: test -s lcov.info && echo "Coverage file lcov.info generated successfully"

      - name: Print per-module coverage summary and update COVERAGE.md
        run: |
          python3 scripts/coverage-summary.py lcov.info
          python3 scripts/coverage-summary.py lcov.info --markdown > docs/COVERAGE.md
          cp docs/COVERAGE.md COVERAGE.md
          test -s docs/COVERAGE.md && echo "docs/COVERAGE.md generated successfully"
          test -s COVERAGE.md && echo "COVERAGE.md generated successfully"

      - name: Upload coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
